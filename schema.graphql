type Transfer {
  id: ID! # transactionHash-instructionAddress
  transactionHash: String!
  slot: Int! @index
  timestamp: Timestamp!
  sender: String!
  receiver: String!
  mint: String!
  symbol: String!
  amount: BigInt! # Raw amount
  amountDisplay: BigDecimal! # UI amount
}

type TransferSummary {
  id: ID! # Fixed: "LATEST_SUMMARY"
  minute: String! # ISO timestamp
  totalTransfers: Int!
  totalVolumeUSD: BigDecimal!
  usdcTransfers: Int!
  usdtTransfers: Int!
  usdcVolumeUSD: BigDecimal!
  usdtVolumeUSD: BigDecimal!
}
