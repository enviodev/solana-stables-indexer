type Transfer {
  id: ID! # <signature>:<instruction path>
  signature: String! @index
  instruction: String! # TransferChecked | Transfer
  slot: Int! @index
  timestamp: Timestamp! @index
  sender: String! @index # source token account
  receiver: String! @index # destination token account
  mint: String! @index
  symbol: String!
  amount: BigInt! # raw amount in base units
  amountDisplay: BigDecimal! # amount / 10^decimals
}

type TransferSummary {
  id: ID! # unix minute (timestamp / 60)
  minute: Timestamp! @index
  totalTransfers: Int!
  totalVolumeUSD: BigDecimal!
  usdcTransfers: Int!
  usdtTransfers: Int!
  usdcVolumeUSD: BigDecimal!
  usdtVolumeUSD: BigDecimal!
}
